# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
  pull_request:
  schedule:
      - cron: '37 11 * * 5'

jobs:
  build-n-publish:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # see setup.py for supported versions
        # here instead of having a matrix
        # we only test combinations in a round-robin fashion
        # make sure the versions are monotmonic increasing w.r.t. each other
        # other wise e.g. an older version of a dependency may not work well with a newer version of Python
        include:
          - python-version: "3.10"
            pandoc-version: "3.7.0.2"
            numpy-version: "numpy>=1.26,<2"
          - python-version: "3.11"
            pandoc-version: "3.8.3"
            numpy-version: "numpy>=2.0,<2.1"
          - python-version: "3.12"
            pandoc-version: "3.9"
            numpy-version: "numpy>=2.1,<2.2"
          - python-version: "3.13"
            pandoc-version: "3.11"
            numpy-version: "numpy>=2.2,<2.3"
          - python-version: "3.14"
            pandoc-version: "3.12"
            numpy-version: "numpy>=2.3"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies—pip
      run: |
        python -m pip install -U pip "${{ matrix.numpy-version }}"
        python -m pip install .[extras,tests]
    - name: Install dependencies—pandoc
      run: |
        # the reference outputs in tests/files need pandoc 3.7.0.2 or later
        v=${{ matrix.pandoc-version }}
        wget --quiet "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-1-amd64.deb"
        sudo dpkg -i "pandoc-$v-1-amd64.deb"
    - name: Tests
      run: |
        make test
        coverage combine || true
        coverage report
        coverage xml
        coverage lcov
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.test_number }}
        parallel: true
        path-to-lcov: ./coverage.lcov
    - name: Coverage—Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
    # c.f. https://packaging.python.org/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
    - name: Build distribution 📦
      if: ${{ startsWith(github.event.ref, 'refs/tags') && matrix.python-version == '3.14' }}
      run: |
        python -m pip install -U build
        python -m build
    - name: Publish distribution 📦 to PyPI
      if: ${{ startsWith(github.event.ref, 'refs/tags') && matrix.python-version == '3.14' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.pypi_password }}

  coveralls_finish:
    needs: build-n-publish
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
