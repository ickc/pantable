# Read the Docs builds the same Quarto site as GitHub Pages (pages.yml), with
# pixi's locked docs environment. build.commands replaces Read the Docs' own
# Sphinx/MkDocs steps: whatever ends up in $READTHEDOCS_OUTPUT/html is served.
version: 2

build:
  os: ubuntu-24.04
  commands:
    - curl -fsSL https://pixi.sh/install.sh | PIXI_HOME="$HOME/.pixi" PIXI_VERSION=v0.81.0 PIXI_NO_PATH_UPDATE=1 bash
    - ~/.pixi/bin/pixi run --locked -e docs docs
    - mkdir -p "$READTHEDOCS_OUTPUT"
    - cp -r docs/_site "$READTHEDOCS_OUTPUT/html"
