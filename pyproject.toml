[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "pantable"
version = "0.14.2"
description = "A Python library for writing pandoc filters for tables with batteries included."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
keywords = [
    "pandoc",
    "pandocfilters",
    "panflute",
    "markdown",
    "latex",
    "html",
    "csv",
    "table",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Processing :: Filters",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
# panflute is responsible for pandoc compatibility.
# Each panflute minor release has tracked a pandoc API bump,
# so cap at the latest tested minor release.
dependencies = [
    "panflute>=2.3.1,<2.4",
    "pyyaml>=5,<7",
    "numpy>=1.16,<3",
]

[project.optional-dependencies]
extras = [
    "coloredlogs>=14,<16",
    "tabulate>=0.8,<0.10",
    "yamlloader>=1,<2",
]

[project.scripts]
pantable = "pantable.cli.pantable:main"
pantable2csv = "pantable.cli.pantable2csv:main"
pantable2csvx = "pantable.cli.pantable2csvx:main"

[project.urls]
Homepage = "https://github.com/ickc/pantable"
Repository = "https://github.com/ickc/pantable"
Documentation = "https://ickc.github.io/pantable"
Changelog = "https://github.com/ickc/pantable/blob/master/CHANGELOG.md"

[dependency-groups]
test = ["pytest", "pytest-xdist", "coverage>=7.10"]
lint = ["ruff"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv.build-backend]
source-include = [
    "tests/**",
    "docs/**",
    "CHANGELOG.md",
]

# pixi: development environments ###############################################
# pandoc comes from conda-forge; everything Python comes from PyPI.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
pandoc = "*"

[tool.pixi.pypi-dependencies]
pantable = { path = ".", editable = true, extras = ["extras"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# numpy from PyPI, so that pip's numpy is the one tested
[tool.pixi.feature.numpy1.pypi-dependencies]
numpy = ">=1.26,<2"

# pandoc versions, oldest supported to latest.
# The reference outputs in tests/files need pandoc 3.7.0.2 or later.
[tool.pixi.feature.pandoc-3-7.dependencies]
pandoc = "3.7.0.2.*"
[tool.pixi.feature.pandoc-3-8.dependencies]
pandoc = "3.8.3.*"
[tool.pixi.feature.pandoc-3-9.dependencies]
pandoc = "3.9.*"
[tool.pixi.feature.pandoc-3-11.dependencies]
pandoc = "3.11.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
# CI matrix: python and pandoc versions increase together
test-py310 = ["test", "py310", "pandoc-3-7", "numpy1"]
test-py311 = ["test", "py311", "pandoc-3-8"]
test-py312 = ["test", "py312", "pandoc-3-9"]
test-py313 = ["test", "py313", "pandoc-3-11"]
test-py314 = ["test", "py314"]

[tool.pixi.tasks]
test = "coverage run -m pytest -vv -n auto"
coverage = { cmd = "coverage combine && coverage report && coverage xml", depends-on = ["test"] }
gen-golden = { cmd = "pytest tests/test_golden.py --update-golden", description = "Regenerate tests/golden/*/expected/ from the filters' output" }
build = "uv build"

[tool.pixi.feature.lint.tasks]
format = "ruff format src tests && ruff check --fix src tests"
lint = "ruff format --check src tests && ruff check src tests"

[tool.pixi.feature.dev.dependencies]
uv = "*"

[tool.pixi.feature.docs.dependencies]
quarto = ">=1.4"
graphviz = "*"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "quarto render docs", description = "Render the documentation site to docs/_site" }
docs-preview = { cmd = "quarto preview docs", description = "Serve the documentation site with live reload" }
dot = { cmd = "make -C docs/dot", description = "Redraw the diagrams in docs/dot" }

[tool.coverage.paths]
source = [
    'src',
    '*/site-packages',
]

[tool.coverage.run]
branch = true
source = [
    'src',
    'tests',
]
parallel = true
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]
addopts = [
    '-ra',
    '--strict-markers',
    '--doctest-modules',
    '--tb=short',
]
testpaths = [
    'tests',
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pantable"]
